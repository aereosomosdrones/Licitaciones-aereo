name: Radar de licitaciones (cada hora)

on:
  schedule:
    # Cada hora, al minuto 7 (GitHub puede atrasar o saltarse ejecuciones programadas;
    # el job "relanzar" de abajo cubre ese caso).
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "config/**"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  actions: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Una sola revisión a la vez. Va en el job (no en el workflow) para que la espera
    # del job "relanzar" no bloquee a otras ejecuciones.
    concurrency:
      group: radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Revisar Mercado Público y Compra Ágil
        id: radar
        continue-on-error: true
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
        run: python -m radar.monitor

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "radar-aereo[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Datos del radar $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((intento * 5))
          done
          exit 1

      - name: Fallar si el radar no pudo revisar ninguna fuente
        if: steps.radar.outcome == 'failure'
        run: |
          echo "::error::El radar no pudo consultar Mercado Público. Revisa el secreto MERCADO_PUBLICO_TICKET y el log del paso 'Revisar Mercado Público y Compra Ágil'."
          exit 1

  # GitHub no garantiza las ejecuciones programadas (en este repo no se dispararon).
  # Este job espera hasta el minuto 5 de la hora siguiente y lanza la próxima revisión,
  # salvo que ya exista otra ejecución creada después de esta (p. ej. la del cron o un
  # push), para no duplicar. Si la cadena se corta, basta con "Run workflow" una vez.
  relanzar:
    needs: radar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Esperar hasta la próxima hora
        run: |
          ahora=$(date -u +%s)
          proxima=$(( (ahora / 3600 + 1) * 3600 + 300 ))
          espera=$(( proxima - ahora ))
          echo "Próxima revisión: $(date -u -d @$proxima +%H:%M) UTC (en $((espera / 60)) min)"
          sleep $espera

      - name: Lanzar la próxima revisión
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          creada=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          posteriores=$(gh run list --workflow radar.yml --limit 10 --json databaseId,createdAt \
            -q "[.[] | select(.databaseId != ${{ github.run_id }} and .createdAt > \"$creada\")] | length")
          if [ "$posteriores" -gt 0 ]; then
            echo "Ya hay una ejecución más reciente; no se relanza."
            exit 0
          fi
          gh workflow run radar.yml --ref main
          echo "Próxima revisión lanzada."
